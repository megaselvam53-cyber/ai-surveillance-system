<!DOCTYPE html>
<html>
<head>
    <title>Officer Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <!-- TITLE -->
    <h2>🔐 Officer Login</h2>
    <p>Select your role and enter password</p>

    <!-- LOGIN FORM -->
    <form method="POST">

        <!-- ROLE -->
        <select name="role" required class="role-select">
            <option value="">-- Select Role --</option>
            <option value="police">👮 Police</option>
            <option value="forensic">🧪 Forensic Officer</option>
            <option value="cyber">💻 Cyber Crime</option>
            <option value="detective">🕵️ Detective</option>
            <option value="security">🔐 Security Officer</option>
        </select>

        <!-- PASSWORD WITH EYE ICON -->
        <div style="position: relative; width: 100%; margin-top: 15px;">
            <input 
                type="password" 
                id="password"
                name="password" 
                placeholder="Enter Password" 
                required
                style="width:100%; padding-right:40px;"
            >

            <span onclick="togglePassword()" 
                  style="
                    position:absolute;
                    right:10px;
                    top:10px;
                    cursor:pointer;
                    color:#aaa;
                  ">
                👁️
            </span>
        </div>

        <!-- BUTTON -->
        <br>
        <button type="submit">Login</button>

    </form>

    <!-- ERROR MESSAGE -->
    {% if error %}
        <p style="
            color:#ff4d4d;
            margin-top:10px;
            font-weight:bold;
        ">
            ❌ {{ error }}
        </p>
    {% endif %}

    <!-- BACK -->
    <br>
    <a href="/login" class="back-btn">⬅ Refresh</a>

</div>

<!-- PASSWORD TOGGLE SCRIPT -->
<script>
function togglePassword() {
    var p = document.getElementById("password");
    if (p.type === "password") {
        p.type = "text";
    } else {
        p.type = "password";
    }
}
</script>

</body>
</html>
